<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxied Search</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fafafa; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 90%; max-width: 500px; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #e0e0e0; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        button { padding: 12px 30px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Target URL</h2>
        <form action="/api/proxy" method="GET">
            <input type="text" name="url" placeholder="https://example.com" required autocomplete="off">
            <br>
            <button type="submit">Browse</button>
        </form>
    </div>
</body>
</html>
